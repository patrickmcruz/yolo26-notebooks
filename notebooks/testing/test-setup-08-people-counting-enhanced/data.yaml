# ============================================================================
# YOLO26 Head Counting - Ultra Performance RTX 4090 Configuration
# ============================================================================
app:
  name: "test-setup-08-heads-counting-enhanced"
  install_requirements: false
  requirements_file: "../../requirements.txt"
  seed: 42

environment:
  YOLO_CONFIG_DIR: ".yolo"
  MPLCONFIGDIR: ".cache/matplotlib"
  TORCH_HOME: ".cache/torch"

paths:
  video: "input/videos/20260329_34-edited.mp4"
  images: "input/images/*"
  # Substitua pelo seu modelo YOLO26 de detecção customizado/pré-treinado para cabeças (ex: CrowdHuman)
  # Para testes iniciais rápidos, você pode usar o yolo26m.pt ou yolo26x.pt adaptado
  weights: "yolo26x.pt" 
  weights_search_dirs:
    - "../"
    - "."
  output_dir: "output"
  annotated_video: "output/20260329_34-edited_yolo26_people_count.mp4"
  frame_counts_csv: "output/frame_counts.csv" # Corrigido o typo anterior
  summary_json: "output/summary.json"
  snapshots_dir: "output/snapshots"

runtime:
  require_cuda: true
  device: 0
  # Batch menor ajuda a evitar estouro de memoria ao rodar em resolucoes gigantes com augment=true
  batch_size: 16 
  auto_reduce_batch_on_oom: true
  empty_cuda_cache_every_batches: 0
  torch_float32_matmul_precision: "highest" # Forca a precisao maxima do PyTorch para calculos matriciais
  allow_tf32: true

inference:
  task: "detect"
  imgsz: 1920 # Aumentado para detectar cabecas pequenas e distantes
  conf: 0.18  # Reduzido para capturar deteccoes menos evidentes/no escuro
  iou: 0.65   # Aumentado para nao suprimir cabecas proximas em multidoes
  max_det: 2000 # Elevado para suportar maior volume de deteccoes simultaneas
  classes:
    - 0
  augment: false # Desativado pois o modelo/formato nao suporta TTA
  half: false   # Desativa FP16 para obter precisao de Float32 completo
  verbose: false
  vid_stride: 1

counting:
  count_source: "boxes" # Contagem direta e pura por caixas de detecção
  require_keypoints: false

output:
  output_resolution: [1280, 720] # Reducao para acelerar compressao CPU (720p = ~51 FPS, 540p = ~58 FPS, false = 70+ FPS)
  save_annotated_video: true
  save_frame_counts: true
  save_summary: true
  save_snapshot_every_n_frames: 30 # Amostragem mais inteligente a cada 1 segundo (a 30 FPS)
  video_codec: "mp4v"
  progress_every_n_frames: 300
  overlay:
    enabled: true
    font_scale: 0.6 # Fontes menores para não poluir telas com centenas de cabeças
    thickness: 1 # Linhas mais finas para melhorar a visualização de aglomerados densos